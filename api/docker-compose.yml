services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: open_mem
      POSTGRES_USER: open_mem
      POSTGRES_DB: open_mem
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_mem"]
      interval: 2s
      timeout: 3s
      retries: 30
