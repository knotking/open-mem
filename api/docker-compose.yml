services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: memdog
      POSTGRES_USER: memdog
      POSTGRES_DB: memdog
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memdog"]
      interval: 2s
      timeout: 3s
      retries: 30
