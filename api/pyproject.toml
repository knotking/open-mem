[project]
name = "memdog-api"
version = "0.1.0"
description = "mem-dog spine: write -> store -> read"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "cryptography>=43",
    "filetype>=1.2",
    "PyJWT[crypto]>=2.10",
    "google-cloud-storage>=2.18",
    # Format handlers. All pure-Python or wheel-shipped: nothing here needs a
    # system library in the runtime image, which is the constraint that decides
    # what can be supported at all.
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "selectolax>=0.3.21",
    "PyYAML>=6.0",
    "charset-normalizer>=3.4",
    # Crawler expressions. A specified query language with no side effects, no
    # I/O and no loops -- so a tenant-supplied transform cannot hang a worker
    # or reach the network, which is what lets configs be data rather than code.
    "jmespath>=1.0",
    # Cloud Trace and Cloud Monitoring speak their own protocols, not OTLP, so
    # these replace standing up a collector purely to translate.
    "opentelemetry-exporter-gcp-trace>=1.7",
    "opentelemetry-exporter-gcp-monitoring>=1.7.0a0",
    # Telemetry. The API and SDK are always present; the OTLP exporter is only
    # used when an endpoint is configured, so local runs stay dependency-light
    # at runtime even though the package is installed.
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memdog"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
