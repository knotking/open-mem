[project]
name = "memdog-api"
version = "0.1.0"
description = "mem-dog spine: write -> store -> read"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "cryptography>=43",
    "filetype>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memdog"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
